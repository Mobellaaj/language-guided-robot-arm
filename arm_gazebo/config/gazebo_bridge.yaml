- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /model/learning_arm/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# Arm targets are radians; the gripper target is each finger's travel in metres.
- ros_topic_name: /arm/base/target
  gz_topic_name: /arm/base/target
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /arm/shoulder/target
  gz_topic_name: /arm/shoulder/target
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /arm/elbow/target
  gz_topic_name: /arm/elbow/target
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /arm/gripper/target
  gz_topic_name: /arm/gripper/target
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

# Wrist pitch angle in radians.
- ros_topic_name: /arm/wrist/target
  gz_topic_name: /arm/wrist/target
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /arm/camera/image_raw
  gz_topic_name: /arm/camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /arm/camera/camera_info
  gz_topic_name: /arm/camera/camera_info
